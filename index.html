<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmaControl</title>
<style>
:root{color-scheme:light dark;--bg:#fbf6f0;--pn:#fff;--ink:#2b1530;--mu:#6e5a74;--ln:#ecdce6;--gr:#c41f79;--on:#fff;--cy:#0b86ad;--lm:#5f9a1a;--okt:#3f6b0e;--am:#8a5a00;--amb:#fbefcf;--rd:#a3281c;--rdb:#f8e2dd;--ok:#e8f4d4;--sb:#c41f79;--sb2:#7a1450;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f24;--pn:#2b1834;--ink:#f8ecf5;--mu:#cdb4c6;--ln:#4a2d56;--gr:#ef6fb2;--on:#2b0a1d;--cy:#4cc9ee;--lm:#a6dc5a;--okt:#b9e57e;--am:#f0c35a;--amb:#3a2c10;--rd:#ff9d8f;--rdb:#46201d;--ok:#263a14;--sb:#7a1450;--sb2:#2a0e27}}
:root[data-theme="dark"]{--bg:#1d0f24;--pn:#2b1834;--ink:#f8ecf5;--mu:#cdb4c6;--ln:#4a2d56;--gr:#ef6fb2;--on:#2b0a1d;--cy:#4cc9ee;--lm:#a6dc5a;--okt:#b9e57e;--am:#f0c35a;--amb:#3a2c10;--rd:#ff9d8f;--rdb:#46201d;--ok:#263a14;--sb:#7a1450;--sb2:#2a0e27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;margin:0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--sb),var(--sb2));color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:3px}
.brand{padding:0 4px 16px}.wm{font:italic 800 28px/1.1 "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#8cc63f;letter-spacing:-.5px;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 3px 6px #0004}.wm i{color:#1fb4e6}.brand .lg{display:block;width:100%;margin-top:12px;border-radius:8px;border:2px solid #fff}
.hero{background:linear-gradient(135deg,#c41f79,#7a1450);margin:-16px -16px 14px;padding:24px 16px 20px;border-radius:10px 10px 0 0;text-align:center}.hero .wm{font-size:42px}.login .lg{display:block;width:100%;border-radius:10px;margin:0 0 14px}
nav button{text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:7px;font:inherit;cursor:pointer}
nav button:hover{background:#ffffff18}nav button.cur{background:#ffffff26;font-weight:600}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid #ffffff22;font-size:13px}.who span{display:block;opacity:.75}
main{padding:24px clamp(14px,3vw,36px);max-width:1080px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.top h1{font-size:28px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.k:hover{border-color:var(--gr)}.k small{color:var(--mu);display:block}.k b{font:600 24px Georgia,serif;font-variant-numeric:tabular-nums}
.k.w b{color:var(--am)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.sheet{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:12px}
.sheet h2{font-size:19px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--mu);font-size:13px;border-bottom:2px solid var(--cy);padding:6px}
td{padding:8px 6px;border-bottom:1px solid var(--ln)}.r{text-align:right}.wrap{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:8px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
button.b{font:inherit;padding:8px 15px;border-radius:6px;border:1px solid var(--gr);background:var(--gr);color:var(--on);cursor:pointer}
button.b.o{background:none;color:var(--gr)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cy);outline-offset:1px}
.msg{padding:10px 12px;border-radius:7px;margin:0 0 12px}.msg.ok{background:var(--ok);color:var(--okt)}.msg.bad{background:var(--rdb);color:var(--rd)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.card .ch{display:flex;justify-content:space-between;gap:6px}.card .ch span{color:var(--mu);font-size:13px}
.card .pr{font:600 20px Georgia,serif;margin:6px 0}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--lm)}.bar.low i{background:var(--am)}
.low{color:var(--am);background:var(--amb);padding:1px 8px;border-radius:99px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:none;color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;cursor:pointer}.chips button.cur{background:var(--gr);border-color:var(--gr);color:var(--on)}
.drop{border:2px dashed var(--ln);border-radius:10px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}.drop.hot{border-color:var(--gr);background:var(--ok)}
.off{color:var(--mu)}.bad{color:var(--rd)}.okc{color:var(--okt)}
.login{max-width:420px;margin:6vh auto}
details{margin-top:14px;border-top:1px dashed var(--ln);padding-top:10px;color:var(--mu);font-size:14px}summary{cursor:pointer}details li{margin:3px 0}details code{color:var(--ink)}.pend{color:var(--am)}
svg text{fill:var(--ink);font-size:12px}
.tirilla pre{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#111;padding:14px;border:1px dashed #bbb;max-width:340px;margin:0 0 10px;white-space:pre-wrap}
@media print{body *{visibility:hidden}.tirilla,.tirilla *{visibility:visible}.tirilla{position:absolute;left:0;top:0;border:0}.tirilla .row,.tirilla h2{display:none}}
.dev{background:var(--amb);color:var(--am);padding:8px 14px;font-size:13px;text-align:center}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;align-items:center}.brand{padding:0 10px 0 0}nav button{white-space:nowrap}.brand .lg{display:none}.who{display:none}.g2{grid-template-columns:1fr}}
</style></head><body>
<div class="dev">Versión en desarrollo: el modelo aún no está completo y se actualiza a medida que avanza el código en Java. Última actualización: 27/10/2026. Incluye anulación de ventas, cierre diario y consolidados.</div>

 const lin=S.dc.map(l=>({n:P(l.c).n,c:l.c,q:l.q,k:l.k,sub:l.q*l.k})),t=lin.reduce((a,l)=>a+l.sub,0);

 lin.forEach(l=>P(l.c).s+=l.q);const n=S.compras.length+1;S.compras.push({n,f:S.fJ,pv:pv.n,lin,t,deuda:cr?{ini:t,ab:[]}:null});
 if(!cr){mov('egreso','Compra '+n+' a '+pv.n,t);S.caja-=t}S.dc=[];say(true,'Compra '+n+(cr?' registrada a crédito.':' pagada de contado.'))}

 c.deuda.ab.push({n:c.deuda.ab.length+1,f:S.fJ,m});mov('egreso','Abono compra '+n+' a '+c.pv,m);S.caja-=m;say(true,'Abono registrado.')}

 for(const c in nd){const p=P(c);if(nd[c]>p.s)return say(false,'Stock insuficiente de '+p.n+': hay '+p.s+', se piden '+nd[c]+'.')}
 const tt=S.dv.reduce((a,l)=>a+l.q*P(l.c).p,0),vr=document.getElementById('vr').value.trim(),rec=mp==='EFECTIVO'?(vr===''?tt:+vr):tt;

 const lin=S.dv.map(l=>{const p=P(l.c);return{c:p.c,n:p.n,q:l.q,pv:p.p,sub:l.q*p.p}});for(const c in nd)P(c).s-=nd[c];
 const t=lin.reduce((a,l)=>a+l.sub,0),n=S.facturas.length+1,cod='F'+String(n).padStart(3,'0');
 S.facturas.push({n,cod,f:S.fJ,h:Date.now(),cl:cl.c,cn:cl.n,mp,lin,t,an:false,rec,cam:rec-t,u:ROLES[S.user].nom});S.tir=n;mov('ingreso','Venta factura '+cod+' ('+mp+')',t);if(mp==='EFECTIVO')S.caja+=t;S.dv=[];

function anular(n){if(!S.abierto)return say(false,'El negocio está cerrado.');if(!need('fac','anular ventas'))return;const f=S.facturas.find(x=>x.n===n);

 const ef=f.mp==='EFECTIVO';if(ef&&f.t>S.caja)return say(false,'La caja no alcanza para devolver '+fmt(f.t)+' en efectivo.');
 f.lin.forEach(l=>P(l.c).s+=l.q);f.an=true;mov('egreso','Anulación factura '+f.cod+' ('+f.mp+')',f.t,hoy());if(ef)S.caja-=f.t;

<div class="sheet"><h2>Facturas emitidas</h2>${tbl(['Código','Fecha','Cliente','Detalle','Pago','Total','Estado',''],S.facturas.map(f=>{const ven=ahora()>f.h+S.horas*36e5;return `<tr class="${f.an?'off':''}"><td>${f.cod}</td><td>${f.f}</td><td>${esc(f.cn)}</td><td>${f.lin.map(l=>l.q+' × '+esc(l.n)).join(', ')}</td><td>${f.mp}</td><td class="r">${fmt(f.t)}</td><td>${f.an?'Anulada':ven?'Plazo vencido':'Dentro del plazo'}</td><td class="r"><button class="b o" onclick="S.tir=${f.n};R()">Ver tirilla</button> ${f.an?'':`<button class="b o" onclick="anular(${f.n})">Anular</button>`}</td></tr>`}))}
<div class="row" style="margin-top:12px"><label>Plazo para anular (horas)<input id="hz" type="number" min="1" value="${S.horas}" style="width:90px"></label><button class="b o" onclick="setHoras()">Guardar plazo</button><label>Solo demostración: adelantar el reloj (horas)<input id="sk" type="number" min="0" value="${S.skew||0}" style="width:90px"></label><button class="b o" onclick="setSkew()">Aplicar</button></div></div>`,
consolidados:()=>{const c=S.cons,r=S.rc;return `<div class="sheet"><h2>Consultar un periodo</h2><div class="row"><label>Desde<input id="cd" type="date" value="${c.d}"></label><label>Hasta<input id="ch" type="date" value="${c.h}"></label><button class="b" onclick="consultar()">Consultar</button><button class="b o" onclick="rango('hoy')">Hoy</button><button class="b o" onclick="rango('mes')">Este mes</button></div></div>`+(r?`<div class="kp">${kk('Ingresos',fmt(r.ing))}${kk('Egresos',fmt(r.egr))}${kk('Balance',fmt(r.ing-r.egr))}${kk('Facturas (sin anuladas)',r.nf)}</div><div class="sheet"><h2>Ventas por medio de pago</h2>${barras([{l:'Efectivo',v:r.ef},{l:'Transferencia',v:r.tr},{l:'Tarjeta',v:r.tj}],fmt)}<p class="off">Es flujo de caja del periodo ${r.d} a ${r.h}, no utilidad: una compra de mercancía cuenta como egreso aunque aún no se haya vendido.</p></div>`:'<p class="off">Elige las fechas y pulsa Consultar.</p>')},
cierres:()=>`<div class="sheet"><h2>Cerrar la jornada del ${S.fJ}</h2><p class="off">El sistema calcula que debería haber <b>${fmt(S.caja)}</b> en efectivo. Cuenta el efectivo real de la caja y escríbelo.</p><div class="row"><label>Efectivo contado<input id="ec" type="number" min="0"></label><button class="b" onclick="cerrar()">Cerrar negocio</button></div></div>
<div class="sheet"><h2>Cierres anteriores</h2>${tbl(['Fecha','Cerró','Apertura','Esperado','Contado','Diferencia','Facturas'],S.cierres.map(c=>{const d=c.cont-c.esp;return `<tr><td>${c.f}</td><td>${esc(c.u)}</td><td class="r">${fmt(c.ap)}</td><td class="r">${fmt(c.esp)}</td><td class="r">${fmt(c.cont)}</td><td class="r ${d<0?'bad':d>0?'okc':''}">${d===0?'Cuadra':(d<0?'Faltan ':'Sobran ')+fmt(Math.abs(d))}</td><td class="r">${c.r.nf}</td></tr>`}))}</div>`};
function R(){
 const m=S.msg?`<p class="msg ${S.msg.ok?'ok':'bad'}" role="status">${esc(S.msg.t)}</p>`:'';
 document.getElementById('nav').innerHTML=`<div class="brand"><div class="wm" role="img" aria-label="FarmaControl">Farma<i>Control</i></div><img class="lg" src="${LOGO}" alt="Mayos Pharmaceutical"></div>`+(S.abierto?TABS.map(([k,l])=>`<button class="${S.tab===k?'cur':''}" onclick="go('${k}')">${l}</button>`).join('')+`<div class="who">${ROLES[S.user].nom}<span>${ROLES[S.user].rol}</span><button onclick="reiniciar()" style="opacity:.8;padding-left:0">Reiniciar datos</button></div>`:'');
 document.getElementById('main').innerHTML=S.abierto?`<div class="top"><h1>${TABS.find(t=>t[0]===S.tab)[1]}</h1><span class="off">Jornada del ${S.fJ}</span></div>`+m+V[S.tab]()+jv(S.tab)
 :`<div class="login sheet"><div class="hero"><div class="wm" role="img" aria-label="FarmaControl">Farma<i>Control</i></div></div><img class="lg" src="${LOGO}" alt="Mayos Pharmaceutical"><h1 style="font-size:26px;margin-bottom:4px">Abrir negocio</h1><p class="off">Ingresa con tu usuario para iniciar la jornada.</p>${m}<div class="row" style="flex-direction:column;align-items:stretch"><label>Usuario<input id="u" value="maryibi"></label><label>Clave<input id="k" type="password" onkeydown="if(event.key==='Enter')entrar()"></label><label>Fecha de la jornada<input id="fe" type="date" value="${hoy()}"></label><button class="b" onclick="entrar()">Abrir negocio</button></div><p class="off">Demostración: maryibi (Administrador) o caja1 (Cajero), clave 1234. No uses claves reales.</p></div>`;
 try{localStorage.setItem('fc3',JSON.stringify(S))}catch(e){}
}
R();
</script></body></html>
